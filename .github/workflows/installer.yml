name: installer

# Builds the optional Inno Setup installer (setup.exe) on demand.
# The portable zip in `release-windows` stays the primary distribution;
# this workflow exists so the installer can be produced without a local
# Windows toolchain.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（留空 = 用 pyproject 里的版本）"
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (desktop + build extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[desktop,build]"

      - name: Freeze with PyInstaller (one folder)
        run: python -m PyInstaller packaging/pdfmend.spec --noconfirm --clean

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          Get-ChildItem "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" | Select-Object FullName

      - name: Compile installer
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          if (-not $version) {
            $version = (& python -c "import pdfmend; print(pdfmend.__version__)").Trim()
          }
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$version" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          $exe = "dist\PDFMend-$version-setup-x64.exe"
          if (-not (Test-Path $exe)) { throw "installer not produced" }
          (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash
          "installer=$((Get-Item $exe).Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PDFMend-installer
          path: dist/*setup*.exe
