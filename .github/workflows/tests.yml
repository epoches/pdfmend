name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install a CJK font (so the fixtures can use Chinese text)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install opencv-python-headless  # exercises preprocess.py; PaddleOCR stays optional/heavy
      - name: Run tests
        run: pytest -q
